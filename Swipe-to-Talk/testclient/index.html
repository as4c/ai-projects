<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Swipe-to-Talk · Call Tester</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --panel-2: #1c232d; --border: #2a323d;
    --ink: #e6edf3; --muted: #9aa5b1; --faint: #6b7480;
    --accent: #ff5c77; --live: #2bd3d9; --ok: #3fb950; --warn: #d29922;
    --radius: 12px; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--faint); font-family: var(--mono); font-size: 12px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; font-family: var(--mono); }
  input, textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 9px 11px; font-family: var(--mono); font-size: 13px;
  }
  textarea { resize: vertical; min-height: 54px; }
  input:focus, textarea:focus { outline: 2px solid var(--live); outline-offset: 0; border-color: transparent; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--ink);
    border-radius: 9px; padding: 10px 16px; transition: filter .15s, transform .05s;
  }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a0a0e; }
  button.live { background: var(--live); border-color: var(--live); color: #04201f; }
  button.ghost { background: transparent; }
  .hidden { display: none !important; }

  /* deck */
  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border); border-radius: 16px; padding: 0; overflow: hidden;
  }
  .card-img { width: 100%; height: 200px; object-fit: cover; background: #222b36; display: block; }
  .card-img.ph { display: flex; align-items: center; justify-content: center; color: var(--faint); font-family: var(--mono); font-size: 13px; }
  .card-body { padding: 14px 16px 4px; }
  .card h2 { margin: 0; font-size: 22px; }
  .tagline { color: var(--muted); margin: 2px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .chip.t { color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, var(--border)); }
  .deck-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px 16px; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--faint); text-align: center; margin-top: 8px; }

  /* call */
  .call-top { display: flex; align-items: center; gap: 14px; }
  .call-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #222b36; border: 2px solid var(--border); }
  .status { font-family: var(--mono); font-size: 13px; padding: 5px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  .status.connecting { color: var(--warn); } .status.connecting .dot { background: var(--warn); animation: pulse 1s infinite; }
  .status.listening  { color: var(--live); } .status.listening .dot  { background: var(--live); animation: pulse .8s infinite; }
  .status.speaking   { color: var(--accent);} .status.speaking .dot   { background: var(--accent); animation: pulse .5s infinite; }
  .status.idle       { color: var(--ok); }    .status.idle .dot       { background: var(--ok); }
  .status.ended      { color: var(--faint); }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .meter-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .meter-box .lbl { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-bottom: 6px; }
  .bar { height: 8px; background: #0c0f14; border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0%; border-radius: 4px; transition: width .06s linear; }
  .bar.you > span { background: var(--live); }
  .bar.bot > span { background: var(--accent); }
  .timer { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  /* log */
  .log { background: #0a0d12; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6; max-height: 200px; overflow: auto; white-space: pre-wrap; }
  .log .e { color: var(--accent); } .log .ok { color: var(--ok); } .log .i { color: var(--muted); } .log .w { color: var(--warn); }
  .hint { color: var(--faint); font-size: 12px; margin-top: 8px; }
  a { color: var(--live); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Swipe-to-Talk · Call Tester</h1>
  <p class="sub">dev tool — fetch avatars, match, and talk to the voice bot end-to-end</p>

  <!-- CONFIG -->
  <div class="panel" id="configPanel">
    <label for="baseUrl">Django base URL</label>
    <input id="baseUrl" value="http://localhost:8000" spellcheck="false" />
    <label for="token">DRF token (from POST /api/demo-login/)</label>
    <textarea id="token" placeholder="paste an access token for a logged-in user"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="loadBtn">Load avatars</button>
      <span class="hint" id="cfgHint">Django must allow this page's origin via CORS (dev).</span>
    </div>
  </div>

  <!-- DECK -->
  <div id="deck" class="hidden">
    <div class="card">
      <img id="cardImg" class="card-img ph" alt="" />
      <div class="card-body">
        <h2 id="cardName">—</h2>
        <p class="tagline" id="cardTag"></p>
        <div class="chips" id="cardTraits"></div>
        <div class="chips" id="cardTopics"></div>
      </div>
      <div class="row" style="padding:0 16px 8px">
        <button class="ghost" id="introBtn">▶ Play voice intro</button>
      </div>
      <div class="deck-actions">
        <button id="passBtn">✕ Pass</button>
        <button class="primary" id="talkBtn">🎙 Talk</button>
      </div>
    </div>
    <p class="count" id="deckCount"></p>
  </div>

  <!-- CALL -->
  <div id="call" class="panel hidden">
    <div class="call-top">
      <img id="callAvatar" class="call-avatar" alt="" />
      <div style="flex:1">
        <div style="font-size:18px;font-weight:700" id="callName">—</div>
        <span class="status idle" id="statusPill"><span class="dot"></span><span id="statusText">connecting…</span></span>
      </div>
      <span class="timer" id="timer">00:00</span>
    </div>
    <div class="meters">
      <div class="meter-box"><div class="lbl">🎙 you</div><div class="bar you"><span id="youBar"></span></div></div>
      <div class="meter-box"><div class="lbl">🔊 avatar</div><div class="bar bot"><span id="botBar"></span></div></div>
    </div>
    <div class="row">
      <button class="primary" id="endBtn">End call</button>
      <span class="hint">Speak — the avatar replies. Talk over it to test barge-in.</span>
    </div>
  </div>

  <!-- LOG -->
  <label style="margin-top:18px">Log</label>
  <div class="log" id="log"></div>

  <audio id="remoteAudio" autoplay></audio>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { avatars: [], idx: 0, session: null, pc: null, localStream: null,
                audioCtx: null, raf: null, startTs: 0, timerInt: null };

function log(msg, cls = "i") { const el = $("log");
  const d = new Date().toLocaleTimeString();
  el.innerHTML += `<span class="${cls}">[${d}] ${msg}</span>\n`; el.scrollTop = el.scrollHeight; }

function base() { return $("baseUrl").value.replace(/\/+$/, ""); }
function authHeaders() {
  const h = { "Content-Type": "application/json" };
  // Accept a raw token; tolerate pasted "Bearer " (even doubled) prefixes.
  const t = $("token").value.trim().replace(/^(bearer\s+)+/i, "");
  if (t) h["Authorization"] = "Token " + t;  // DRF TokenAuthentication
  return h;
}

// ---------- Avatars ----------
async function loadAvatars() {
  try {
    log("GET /voice-avatars/avatars/ …");
    const res = await fetch(base() + "/voice-avatars/avatars/", { headers: authHeaders() });
    if (!res.ok) { log(`avatars failed: HTTP ${res.status} ${await res.text()}`, "e"); return; }
    const data = await res.json();
    state.avatars = data.avatars || [];
    state.idx = 0;
    log(`loaded ${state.avatars.length} avatars`, "ok");
    $("configPanel").classList.add("hidden");
    $("deck").classList.remove("hidden");
    renderCard();
  } catch (e) { log("avatars error: " + e.message, "e"); }
}

function renderCard() {
  if (state.idx >= state.avatars.length) {
    $("deck").innerHTML = `<div class="panel">No more avatars. <button class="ghost" onclick="location.reload()">Restart</button></div>`;
    return;
  }
  const a = state.avatars[state.idx];
  const img = $("cardImg");
  if (a.avatar_image_url && !a.avatar_image_url.includes("example.com")) {
    img.src = a.avatar_image_url; img.classList.remove("ph"); img.textContent = "";
  } else { img.removeAttribute("src"); img.classList.add("ph"); img.textContent = "(no image — placeholder URL)"; }
  $("cardName").textContent = a.age ? `${a.name}, ${a.age}` : a.name;
  $("cardTag").textContent = [a.location, ...(a.interests || [])].filter(Boolean).join(" · ");
  $("cardTraits").innerHTML = (a.personality_traits || []).map((t) => `<span class="chip t">${t}</span>`).join("");
  $("cardTopics").innerHTML = (a.conversation_topics || []).map((t) => `<span class="chip">${t}</span>`).join("");
  $("deckCount").textContent = `${state.idx + 1} / ${state.avatars.length}  ·  ${a.name} (#${a.id})`;
}

function playIntro() {
  const a = state.avatars[state.idx];
  if (!a.voice_intro_url || a.voice_intro_url.includes("example.com")) { log("no real voice_intro_url set", "w"); return; }
  new Audio(a.voice_intro_url).play().catch((e) => log("intro play blocked: " + e.message, "w"));
}

function passCard() { state.idx++; renderCard(); }

// ---------- Match ----------
async function talk() {
  const a = state.avatars[state.idx];
  try {
    log(`POST /voice-avatars/match/ {avatar_id:"${a.id}"} …`);
    const res = await fetch(base() + "/voice-avatars/match/", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ avatar_id: a.id }),
    });
    if (res.status === 402) { log("🔒 locked — spend-gate hit (402). Add coins to unlock.", "w"); return; }
    if (!res.ok) { log(`match failed: HTTP ${res.status} ${await res.text()}`, "e"); return; }
    const data = await res.json();
    state.session = data;
    log(`matched → session ${data.session_id}`, "ok");
    log(`bot_url = ${data.bot_url}`);
    startCall(a, data);
  } catch (e) { log("match error: " + e.message, "e"); }
}

// ---------- WebRTC call (Pipecat SmallWebRTC signaling) ----------
async function startCall(avatar, session) {
  $("deck").classList.add("hidden");
  $("call").classList.remove("hidden");
  $("callName").textContent = avatar.name;
  const av = $("callAvatar");
  if (avatar.avatar_image_url && !avatar.avatar_image_url.includes("example.com")) av.src = avatar.avatar_image_url;
  setStatus("connecting", "connecting…");

  try {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    state.pc = pc;

    pc.ontrack = (e) => { $("remoteAudio").srcObject = e.streams[0]; monitor("bot", e.streams[0]); };
    pc.createDataChannel("chat"); // pipecat client opens one; harmless if unused
    pc.onconnectionstatechange = () => {
      log("pc: " + pc.connectionState);
      if (pc.connectionState === "connected") setStatus("idle", "connected");
      if (["failed", "disconnected", "closed"].includes(pc.connectionState)) endCall(true);
    };

    log("requesting mic…");
    state.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.localStream.getTracks().forEach((t) => pc.addTrack(t, state.localStream));
    monitor("you", state.localStream);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await iceComplete(pc);

    const body = { sdp: pc.localDescription.sdp, type: pc.localDescription.type, session_id: session.session_id };
    log("POST offer → " + session.bot_url);
    const res = await fetch(session.bot_url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { log(`bot offer failed: HTTP ${res.status} ${await res.text()}`, "e"); endCall(true); return; }
    const answer = await res.json();
    await pc.setRemoteDescription(answer);
    log("answer set — negotiating…", "ok");
    startTimer();
  } catch (e) { log("call error: " + e.message, "e"); endCall(true); }
}

function iceComplete(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const check = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", check); resolve(); } };
    pc.addEventListener("icegatheringstatechange", check);
    setTimeout(resolve, 2000); // fallback: don't hang if a candidate stalls
  });
}

// ---------- Audio meters + status heuristic ----------
function monitor(which, stream) {
  if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = state.audioCtx.createMediaStreamSource(stream);
  const an = state.audioCtx.createAnalyser(); an.fftSize = 512;
  src.connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  state["an_" + which] = { an, buf };
  if (!state.raf) tick();
}

function level(key) {
  const m = state["an_" + key]; if (!m) return 0;
  m.an.getByteTimeDomainData(m.buf);
  let sum = 0; for (let i = 0; i < m.buf.length; i++) { const v = (m.buf[i] - 128) / 128; sum += v * v; }
  return Math.min(1, Math.sqrt(sum / m.buf.length) * 3);
}

function tick() {
  const you = level("you"), bot = level("bot");
  $("youBar").style.width = (you * 100).toFixed(0) + "%";
  $("botBar").style.width = (bot * 100).toFixed(0) + "%";
  // heuristic status (raw WebRTC has no Pipecat events): whoever is louder is "active"
  if (state.pc && state.pc.connectionState === "connected") {
    if (bot > 0.06 && bot >= you) setStatus("speaking", "avatar speaking");
    else if (you > 0.06) setStatus("listening", "listening to you");
    else setStatus("idle", "connected");
  }
  state.raf = requestAnimationFrame(tick);
}

function setStatus(cls, text) { const p = $("statusPill"); p.className = "status " + cls; $("statusText").textContent = text; }

function startTimer() {
  state.startTs = Date.now();
  state.timerInt = setInterval(() => {
    const s = Math.floor((Date.now() - state.startTs) / 1000);
    $("timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 500);
}

// ---------- End ----------
async function endCall(silent) {
  const dur = state.startTs ? Math.floor((Date.now() - state.startTs) / 1000) : 0;
  if (state.raf) cancelAnimationFrame(state.raf), (state.raf = null);
  if (state.timerInt) clearInterval(state.timerInt);
  if (state.pc) { try { state.pc.close(); } catch (e) {} state.pc = null; }
  if (state.localStream) { state.localStream.getTracks().forEach((t) => t.stop()); state.localStream = null; }
  setStatus("ended", "ended");
  if (state.session) {
    try {
      log(`POST /voice-avatars/${state.session.session_id}/end/ {duration_seconds:${dur}} …`);
      const res = await fetch(base() + `/voice-avatars/${state.session.session_id}/end/`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ duration_seconds: dur }),
      });
      if (res.ok) { const d = await res.json(); log(`ended (${d.duration_seconds}s), next_locked=${d.next_locked}`, "ok"); }
      else log(`end failed: HTTP ${res.status}`, "w");
    } catch (e) { log("end error: " + e.message, "w"); }
  }
  state.session = null; state.startTs = 0;
  setTimeout(() => { $("call").classList.add("hidden"); $("deck").classList.remove("hidden"); state.idx++; renderCard(); }, silent ? 0 : 700);
}

// wire up
$("loadBtn").onclick = loadAvatars;
$("introBtn").onclick = playIntro;
$("passBtn").onclick = passCard;
$("talkBtn").onclick = talk;
$("endBtn").onclick = () => endCall(false);
log("ready. set Django URL + token, then Load avatars.", "i");
</script>
</body>
</html>
